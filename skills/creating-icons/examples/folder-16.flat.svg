<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" class="ic ic-folder ic-flat ic-sm" fill="none" overflow="visible">
  <style>
    .ic-folder{--f3:#bcc7fe;--f2:#7785fa;--f1:#241e80;--bd:#5f67eb}
    @media (prefers-color-scheme:dark){:root:not(.light):not([data-theme=light]) .ic-folder{--f3:#5b66c5;--f2:#abb9fe;--f1:#2c2b8c;--bd:#ccd5ff}}
    :root.dark .ic-folder,:root[data-theme=dark] .ic-folder{--f3:#5b66c5;--f2:#abb9fe;--f1:#2c2b8c;--bd:#ccd5ff}
    .ic-folder .f1{fill:var(--f1)}.ic-folder .f2{fill:var(--f2)}.ic-folder .f3{fill:var(--f3)}
    .ic-folder .s1{stroke:var(--f1)}.ic-folder .s2{stroke:var(--f2)}.ic-folder .s3{stroke:var(--f3)}
    .ic-folder .fb{fill:var(--bd)}
