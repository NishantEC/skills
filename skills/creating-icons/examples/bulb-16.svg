<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" class="ic ic-bulb ic-sm" fill="none" overflow="visible">
  <style>
    .ic-bulb{--g3a:#fcedd2;--g3b:#fadba5;--g2a:#f9d28f;--g2b:#f5ba55;--g1a:#f2a623;--g1b:#c28319;--ln1:#7e5510;--ln2:#b37917;--ln3:#f8cd84;--edge:#b37917;--sh:rgb(242 164 31 / .32);--ring:#fff}
    @media (prefers-color-scheme:dark){:root:not(.light):not([data-theme=light]) .ic-bulb{--g3a:#db9d45;--g3b:#ba7e1e;--g2a:#fdca87;--g2b:#ed9e05;--g1a:#cd8800;--g1b:#956306;--ln1:#412801;--ln2:#fbb44e;--ln3:#d6a86b;--edge:#ffe3c0;--sh:rgb(0 0 0 / .55);--ring:#18181b}}
    :root.dark .ic-bulb,:root[data-theme=dark] .ic-bulb{--g3a:#db9d45;--g3b:#ba7e1e;--g2a:#fdca87;--g2b:#ed9e05;--g1a:#cd8800;--g1b:#956306;--ln1:#412801;--ln2:#fbb44e;--ln3:#d6a86b;--edge:#ffe3c0;--sh:rgb(0 0 0 / .55);--ring:#18181b}
    .ic-bulb .g1a{stop-color:var(--g1a)}.ic-bulb .g1b{stop-color:var(--g1b)}
    .ic-bulb .g2a{stop-color:var(--g2a)}.ic-bulb .g2b{stop-color:var(--g2b)}
    .ic-bulb .g3a{stop-color:var(--g3a)}.ic-bulb .g3b{stop-color:var(--g3b)}
    .ic-bulb .l1{stroke:var(--ln1)}.ic-bulb .l2{stroke:var(--ln2)}.ic-bulb .l3{stroke:var(--ln3)}
    .ic-bulb .rim{stroke:var(--edge)}.ic-bulb .bd{stroke:var(--ring)}
    .ic-bulb .sh{flood-color:var(--sh)}
    .ic-bulb .hl{fill:#fff;fill-opacity:.42}
    .ic-bulb [data-part=badge]{transform-box:fill-box;transform-origin:center;transform:scale(0)}
    .ic-bulb[data-state=on] [data-part=badge]{transform:scale(1)}
  </style>
