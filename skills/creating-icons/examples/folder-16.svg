<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" class="ic ic-folder ic-sm" fill="none" overflow="visible">
  <style>
    .ic-folder{--g3a:#dee0fa;--g3b:#bdc1f5;--g2a:#adb1f3;--g2b:#8288ec;--g1a:#5e66e7;--g1b:#494fb8;--ln1:#2f3378;--ln2:#4349aa;--ln3:#a5a9f1;--edge:#4349aa;--sh:rgb(91 99 230 / .32);--ring:#fff}
    @media (prefers-color-scheme:dark){:root:not(.light):not([data-theme=light]) .ic-folder{--g3a:#94a3fc;--g3b:#7381e9;--g2a:#c9d2fd;--g2b:#9caafe;--g1a:#7d8cfe;--g1b:#5356e7;--ln1:#210287;--ln2:#b4c0fe;--ln3:#9caafb;--edge:#e1e7fe;--sh:rgb(0 0 0 / .55);--ring:#18181b}}
    :root.dark .ic-folder,:root[data-theme=dark] .ic-folder{--g3a:#94a3fc;--g3b:#7381e9;--g2a:#c9d2fd;--g2b:#9caafe;--g1a:#7d8cfe;--g1b:#5356e7;--ln1:#210287;--ln2:#b4c0fe;--ln3:#9caafb;--edge:#e1e7fe;--sh:rgb(0 0 0 / .55);--ring:#18181b}
    .ic-folder .g1a{stop-color:var(--g1a)}.ic-folder .g1b{stop-color:var(--g1b)}
    .ic-folder .g2a{stop-color:var(--g2a)}.ic-folder .g2b{stop-color:var(--g2b)}
    .ic-folder .g3a{stop-color:var(--g3a)}.ic-folder .g3b{stop-color:var(--g3b)}
    .ic-folder .l1{stroke:var(--ln1)}.ic-folder .l2{stroke:var(--ln2)}.ic-folder .l3{stroke:var(--ln3)}
    .ic-folder .rim{stroke:var(--edge)}.ic-folder .bd{stroke:var(--ring)}
    .ic-folder .sh{flood-color:var(--sh)}
    .ic-folder .hl{fill:#fff;fill-opacity:.42}
    .ic-folder [data-part=badge]{transform-box:fill-box;transform-origin:center;transform:scale(0)}
    .ic-folder[data-state=on] [data-part=badge]{transform:scale(1)}
  </style>
