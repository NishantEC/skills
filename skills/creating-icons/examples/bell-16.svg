<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" class="ic ic-bell ic-sm" fill="none" overflow="visible">
  <style>
    .ic-bell{--g3a:#fcedd2;--g3b:#fadba5;--g2a:#f9d28f;--g2b:#f5ba55;--g1a:#f2a623;--g1b:#c28319;--ln1:#7e5510;--ln2:#b37917;--ln3:#f8cd84;--edge:#b37917;--sh:rgb(242 164 31 / .32);--ring:#fff}
    @media (prefers-color-scheme:dark){:root:not(.light):not([data-theme=light]) .ic-bell{--g3a:#db9d45;--g3b:#ba7e1e;--g2a:#fdca87;--g2b:#ed9e05;--g1a:#cd8800;--g1b:#956306;--ln1:#412801;--ln2:#fbb44e;--ln3:#d6a86b;--edge:#ffe3c0;--sh:rgb(0 0 0 / .55);--ring:#18181b}}
    :root.dark .ic-bell,:root[data-theme=dark] .ic-bell{--g3a:#db9d45;--g3b:#ba7e1e;--g2a:#fdca87;--g2b:#ed9e05;--g1a:#cd8800;--g1b:#956306;--ln1:#412801;--ln2:#fbb44e;--ln3:#d6a86b;--edge:#ffe3c0;--sh:rgb(0 0 0 / .55);--ring:#18181b}
    .ic-bell .g1a{stop-color:var(--g1a)}.ic-bell .g1b{stop-color:var(--g1b)}
    .ic-bell .g2a{stop-color:var(--g2a)}.ic-bell .g2b{stop-color:var(--g2b)}
    .ic-bell .g3a{stop-color:var(--g3a)}.ic-bell .g3b{stop-color:var(--g3b)}
    .ic-bell .l1{stroke:var(--ln1)}.ic-bell .l2{stroke:var(--ln2)}.ic-bell .l3{stroke:var(--ln3)}
    .ic-bell .rim{stroke:var(--edge)}.ic-bell .bd{stroke:var(--ring)}
    .ic-bell .sh{flood-color:var(--sh)}
    .ic-bell .hl{fill:#fff;fill-opacity:.42}
    .ic-bell [data-part=badge]{transform-box:fill-box;transform-origin:center;transform:scale(0)}
    .ic-bell[data-state=on] [data-part=badge]{transform:scale(1)}
  </style>
  <defs><linearGradient id="ic-bell-sm-g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="g1a"/><stop offset="1" class="g1b"/></linearGradient><linearGradient id="ic-bell-sm-g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="g2a"/><stop offset="1" class="g2b"/></linearGradient><linearGradient id="ic-bell-sm-g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="g3a"/><stop offset="1" class="g3b"/></linearGradient><filter id="ic-bell-sm-sh" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="1.1"/><feOffset dy="1.3" result="o"/><feFlood class="sh"/><feComposite in2="o" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
