    <g data-part="clapper"><path class="rim" d="M10 19.4a2 2 0 1 0 4 0a2 2 0 1 0 -4 0Z" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 19.4a2 2 0 1 0 4 0a2 2 0 1 0 -4 0Z" fill="url(#ic-bell-sm-g1)"/></g>
    <g data-part="bell"><path class="rim" d="M12 4.5C15.6 4.5 17.6 7.2 17.6 10.6V13Q17.6 14.6 19.2 15.6Q20.5 16.4 20.5 17Q20.5 18 19.3 18H4.7Q3.5 18 3.5 17Q3.5 16.4 4.8 15.6Q6.4 14.6 6.4 13V10.6C6.4 7.2 8.4 4.5 12 4.5Z" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 4.5C15.6 4.5 17.6 7.2 17.6 10.6V13Q17.6 14.6 19.2 15.6Q20.5 16.4 20.5 17Q20.5 18 19.3 18H4.7Q3.5 18 3.5 17Q3.5 16.4 4.8 15.6Q6.4 14.6 6.4 13V10.6C6.4 7.2 8.4 4.5 12 4.5Z" fill="url(#ic-bell-sm-g2)"/></g>
