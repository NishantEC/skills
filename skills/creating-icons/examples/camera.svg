<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="ic ic-camera" fill="none" overflow="visible">
  <style>
    .ic-camera{--g3a:#e8e2fc;--g3b:#d1c4f9;--g2a:#c5b6f8;--g2b:#a78ff4;--g1a:#8d6ff0;--g1b:#6f56c0;--ln1:#48387d;--ln2:#6750b2;--ln3:#bfaef7;--edge:#6750b2;--sh:rgb(139 108 240 / .32);--ring:#fff}
    @media (prefers-color-scheme:dark){:root:not(.light):not([data-theme=light]) .ic-camera{--g3a:#ab99fe;--g3b:#8d79e1;--g2a:#d3cdfe;--g2b:#b1a2fb;--g1a:#9a81fa;--g1b:#744bdc;--ln1:#35007a;--ln2:#c3bafc;--ln3:#b1a4f4;--edge:#e7e4ff;--sh:rgb(0 0 0 / .55);--ring:#18181b}}
    :root.dark .ic-camera,:root[data-theme=dark] .ic-camera{--g3a:#ab99fe;--g3b:#8d79e1;--g2a:#d3cdfe;--g2b:#b1a2fb;--g1a:#9a81fa;--g1b:#744bdc;--ln1:#35007a;--ln2:#c3bafc;--ln3:#b1a4f4;--edge:#e7e4ff;--sh:rgb(0 0 0 / .55);--ring:#18181b}
    .ic-camera .g1a{stop-color:var(--g1a)}.ic-camera .g1b{stop-color:var(--g1b)}
    .ic-camera .g2a{stop-color:var(--g2a)}.ic-camera .g2b{stop-color:var(--g2b)}
    .ic-camera .g3a{stop-color:var(--g3a)}.ic-camera .g3b{stop-color:var(--g3b)}
    .ic-camera .l1{stroke:var(--ln1)}.ic-camera .l2{stroke:var(--ln2)}.ic-camera .l3{stroke:var(--ln3)}
    .ic-camera .rim{stroke:var(--edge)}.ic-camera .bd{stroke:var(--ring)}
    .ic-camera .sh{flood-color:var(--sh)}
    .ic-camera .hl{fill:#fff;fill-opacity:.42}
    .ic-camera [data-part=badge]{transform-box:fill-box;transform-origin:center;transform:scale(0)}
    .ic-camera[data-state=on] [data-part=badge]{transform:scale(1)}
  </style>
