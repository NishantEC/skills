    <g data-part="iris"><path class="rim" d="M9.4 14a2.6 2.6 0 1 0 5.2 0a2.6 2.6 0 1 0 -5.2 0Z" stroke-width="1.5" stroke-linejoin="round"/><path d="M9.4 14a2.6 2.6 0 1 0 5.2 0a2.6 2.6 0 1 0 -5.2 0Z" fill="url(#ic-camera-g3)"/></g>
    <path class="rim" d="M17 11a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0 -2.6 0Z" stroke-width="1.5" stroke-linejoin="round"/><path d="M17 11a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0 -2.6 0Z" fill="url(#ic-camera-g1)"/>
  </g>
