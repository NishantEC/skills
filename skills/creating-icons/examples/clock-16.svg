    <path class="rim" d="M3.5 13a8.5 8.5 0 1 0 17 0a8.5 8.5 0 1 0 -17 0Z" stroke-width="1.5" stroke-linejoin="round"/><path d="M3.5 13a8.5 8.5 0 1 0 17 0a8.5 8.5 0 1 0 -17 0Z" fill="url(#ic-clock-sm-g3)"/>
    <path class="rim" d="M5.8 13a6.2 6.2 0 1 0 12.4 0a6.2 6.2 0 1 0 -12.4 0Z" stroke-width="1.5" stroke-linejoin="round"/><path d="M5.8 13a6.2 6.2 0 1 0 12.4 0a6.2 6.2 0 1 0 -12.4 0Z" fill="url(#ic-clock-sm-g2)"/>
    <g data-part="minute"><path class="l1" d="M12 13V8.9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <path class="l1" d="M12 13L14.6 14.6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
    <circle data-part="badge" class="bd" cx="19.4" cy="19.4" r="2.6" fill="url(#ic-clock-sm-g1)" stroke-width="1.2"/>
  </g>
</svg>
