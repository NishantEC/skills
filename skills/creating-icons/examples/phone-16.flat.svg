<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" class="ic ic-phone ic-flat ic-sm" fill="none" overflow="visible">
  <style>
    .ic-phone{--f3:#fdb0d0;--f2:#e4569d;--f1:#600039;--bd:#c83b84}
    @media (prefers-color-scheme:dark){:root:not(.light):not([data-theme=light]) .ic-phone{--f3:#ad4979;--f2:#ff99c5;--f1:#720044;--bd:#fec5dc}}
    :root.dark .ic-phone,:root[data-theme=dark] .ic-phone{--f3:#ad4979;--f2:#ff99c5;--f1:#720044;--bd:#fec5dc}
    .ic-phone .f1{fill:var(--f1)}.ic-phone .f2{fill:var(--f2)}.ic-phone .f3{fill:var(--f3)}
    .ic-phone .s1{stroke:var(--f1)}.ic-phone .s2{stroke:var(--f2)}.ic-phone .s3{stroke:var(--f3)}
    .ic-phone .fb{fill:var(--bd)}
    .ic-phone [data-part=badge]{transform-box:fill-box;transform-origin:center;transform:scale(0)}
    .ic-phone[data-state=on] [data-part=badge]{transform:scale(1)}
  </style>
