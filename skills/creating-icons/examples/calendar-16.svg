<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" class="ic ic-calendar ic-sm" fill="none" overflow="visible">
  <style>
    .ic-calendar{--g3a:#d8ecf3;--g3b:#b2d9e7;--g2a:#9fcfe2;--g2b:#6cb6d2;--g1a:#42a1c5;--g1b:#327f9d;--ln1:#205366;--ln2:#2e7691;--ln3:#95cadf;--edge:#2e7691;--sh:rgb(62 159 196 / .32);--ring:#fff}
    @media (prefers-color-scheme:dark){:root:not(.light):not([data-theme=light]) .ic-calendar{--g3a:#6fb6d4;--g3b:#4f96b4;--g2a:#9ae0fe;--g2b:#4cc0ec;--g1a:#35a6cf;--g1b:#0c7a9c;--ln1:#023344;--ln2:#7ed1f3;--ln3:#87bad0;--edge:#cceefe;--sh:rgb(0 0 0 / .55);--ring:#18181b}}
    :root.dark .ic-calendar,:root[data-theme=dark] .ic-calendar{--g3a:#6fb6d4;--g3b:#4f96b4;--g2a:#9ae0fe;--g2b:#4cc0ec;--g1a:#35a6cf;--g1b:#0c7a9c;--ln1:#023344;--ln2:#7ed1f3;--ln3:#87bad0;--edge:#cceefe;--sh:rgb(0 0 0 / .55);--ring:#18181b}
    .ic-calendar .g1a{stop-color:var(--g1a)}.ic-calendar .g1b{stop-color:var(--g1b)}
    .ic-calendar .g2a{stop-color:var(--g2a)}.ic-calendar .g2b{stop-color:var(--g2b)}
    .ic-calendar .g3a{stop-color:var(--g3a)}.ic-calendar .g3b{stop-color:var(--g3b)}
    .ic-calendar .l1{stroke:var(--ln1)}.ic-calendar .l2{stroke:var(--ln2)}.ic-calendar .l3{stroke:var(--ln3)}
    .ic-calendar .rim{stroke:var(--edge)}.ic-calendar .bd{stroke:var(--ring)}
    .ic-calendar .sh{flood-color:var(--sh)}
    .ic-calendar .hl{fill:#fff;fill-opacity:.42}
    .ic-calendar [data-part=badge]{transform-box:fill-box;transform-origin:center;transform:scale(0)}
    .ic-calendar[data-state=on] [data-part=badge]{transform:scale(1)}
