<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="ic ic-calendar ic-flat" fill="none" overflow="visible">
  <style>
    .ic-calendar{--f3:#a4d3e8;--f2:#3e9fc4;--f1:#01394b;--bd:#1c86aa}
