    <path class="f2" d="M6 6.5H15Q18.5 6.5 18.5 10V14Q18.5 17.5 15 17.5H10L6.2 20.8Q5.3 21.5 5.3 20.4V17.4Q2.5 17 2.5 14V10Q2.5 6.5 6 6.5Z"/>
    <g data-part="dot1"><path class="f1" d="M4.85 12a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0Z"/></g>
    <g data-part="dot2"><path class="f1" d="M9.25 12a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0Z"/></g>
    <g data-part="dot3"><path class="f1" d="M13.65 12a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0Z"/></g>
