<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="ic ic-chat-bubble ic-flat" fill="none" overflow="visible">
  <style>
    .ic-chat-bubble{--f3:#fdb0d0;--f2:#e4569d;--f1:#600039;--bd:#c83b84}
    @media (prefers-color-scheme:dark){:root:not(.light):not([data-theme=light]) .ic-chat-bubble{--f3:#ad4979;--f2:#ff99c5;--f1:#720044;--bd:#fec5dc}}
    :root.dark .ic-chat-bubble,:root[data-theme=dark] .ic-chat-bubble{--f3:#ad4979;--f2:#ff99c5;--f1:#720044;--bd:#fec5dc}
    .ic-chat-bubble .f1{fill:var(--f1)}.ic-chat-bubble .f2{fill:var(--f2)}.ic-chat-bubble .f3{fill:var(--f3)}
    .ic-chat-bubble .s1{stroke:var(--f1)}.ic-chat-bubble .s2{stroke:var(--f2)}.ic-chat-bubble .s3{stroke:var(--f3)}
    .ic-chat-bubble .fb{fill:var(--bd)}
    .ic-chat-bubble [data-part=badge]{transform-box:fill-box;transform-origin:center;transform:scale(0)}
    .ic-chat-bubble[data-state=on] [data-part=badge]{transform:scale(1)}
  </style>
  <g>
