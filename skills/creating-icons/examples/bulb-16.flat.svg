<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" class="ic ic-bulb ic-flat ic-sm" fill="none" overflow="visible">
  <style>
    .ic-bulb{--f3:#edc28b;--f2:#c58202;--f1:#472c00;--bd:#a66d00}
    @media (prefers-color-scheme:dark){:root:not(.light):not([data-theme=light]) .ic-bulb{--f3:#986611;--f2:#f7ad3b;--f1:#553600;--bd:#fdcf92}}
    :root.dark .ic-bulb,:root[data-theme=dark] .ic-bulb{--f3:#986611;--f2:#f7ad3b;--f1:#553600;--bd:#fdcf92}
    .ic-bulb .f1{fill:var(--f1)}.ic-bulb .f2{fill:var(--f2)}.ic-bulb .f3{fill:var(--f3)}
    .ic-bulb .s1{stroke:var(--f1)}.ic-bulb .s2{stroke:var(--f2)}.ic-bulb .s3{stroke:var(--f3)}
    .ic-bulb .fb{fill:var(--bd)}
    .ic-bulb [data-part=badge]{transform-box:fill-box;transform-origin:center;transform:scale(0)}
    .ic-bulb[data-state=on] [data-part=badge]{transform:scale(1)}
