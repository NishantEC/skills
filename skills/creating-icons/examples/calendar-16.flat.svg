<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" class="ic ic-calendar ic-flat ic-sm" fill="none" overflow="visible">
  <style>
    .ic-calendar{--f3:#a4d3e8;--f2:#3e9fc4;--f1:#01394b;--bd:#1c86aa}
    @media (prefers-color-scheme:dark){:root:not(.light):not([data-theme=light]) .ic-calendar{--f3:#397b95;--f2:#73cbef;--f1:#004459;--bd:#a3e2fe}}
    :root.dark .ic-calendar,:root[data-theme=dark] .ic-calendar{--f3:#397b95;--f2:#73cbef;--f1:#004459;--bd:#a3e2fe}
    .ic-calendar .f1{fill:var(--f1)}.ic-calendar .f2{fill:var(--f2)}.ic-calendar .f3{fill:var(--f3)}
    .ic-calendar .s1{stroke:var(--f1)}.ic-calendar .s2{stroke:var(--f2)}.ic-calendar .s3{stroke:var(--f3)}
    .ic-calendar .fb{fill:var(--bd)}
    .ic-calendar [data-part=badge]{transform-box:fill-box;transform-origin:center;transform:scale(0)}
    .ic-calendar[data-state=on] [data-part=badge]{transform:scale(1)}
  </style>
