<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="ic ic-phone" fill="none" overflow="visible">
  <style>
    .ic-phone{--g3a:#fadeec;--g3b:#f6bdd9;--g2a:#f4add0;--g2b:#ee82b7;--g1a:#e85da2;--g1b:#ba4880;--ln1:#792f53;--ln2:#ac4376;--ln3:#f2a4cb;--edge:#ac4376;--sh:rgb(232 90 160 / .32);--ring:#fff}
    @media (prefers-color-scheme:dark){:root:not(.light):not([data-theme=light]) .ic-phone{--g3a:#f27fb3;--g3b:#cf6094;--g2a:#ffbfd9;--g2b:#fc83ba;--g1a:#f253a4;--g1b:#c01d79;--ln1:#570033;--ln2:#fca6cb;--ln3:#e992b8;--edge:#ffddea;--sh:rgb(0 0 0 / .55);--ring:#18181b}}
    :root.dark .ic-phone,:root[data-theme=dark] .ic-phone{--g3a:#f27fb3;--g3b:#cf6094;--g2a:#ffbfd9;--g2b:#fc83ba;--g1a:#f253a4;--g1b:#c01d79;--ln1:#570033;--ln2:#fca6cb;--ln3:#e992b8;--edge:#ffddea;--sh:rgb(0 0 0 / .55);--ring:#18181b}
    .ic-phone .g1a{stop-color:var(--g1a)}.ic-phone .g1b{stop-color:var(--g1b)}
    .ic-phone .g2a{stop-color:var(--g2a)}.ic-phone .g2b{stop-color:var(--g2b)}
    .ic-phone .g3a{stop-color:var(--g3a)}.ic-phone .g3b{stop-color:var(--g3b)}
    .ic-phone .l1{stroke:var(--ln1)}.ic-phone .l2{stroke:var(--ln2)}.ic-phone .l3{stroke:var(--ln3)}
    .ic-phone .rim{stroke:var(--edge)}.ic-phone .bd{stroke:var(--ring)}
    .ic-phone .sh{flood-color:var(--sh)}
    .ic-phone .hl{fill:#fff;fill-opacity:.42}
    .ic-phone [data-part=badge]{transform-box:fill-box;transform-origin:center;transform:scale(0)}
    .ic-phone[data-state=on] [data-part=badge]{transform:scale(1)}
