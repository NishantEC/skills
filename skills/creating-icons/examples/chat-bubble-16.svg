<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" class="ic ic-chat-bubble ic-sm" fill="none" overflow="visible">
  <style>
    .ic-chat-bubble{--g3a:#fadeec;--g3b:#f6bdd9;--g2a:#f4add0;--g2b:#ee82b7;--g1a:#e85da2;--g1b:#ba4880;--ln1:#792f53;--ln2:#ac4376;--ln3:#f2a4cb;--edge:#ac4376;--sh:rgb(232 90 160 / .32);--ring:#fff}
    @media (prefers-color-scheme:dark){:root:not(.light):not([data-theme=light]) .ic-chat-bubble{--g3a:#f27fb3;--g3b:#cf6094;--g2a:#ffbfd9;--g2b:#fc83ba;--g1a:#f253a4;--g1b:#c01d79;--ln1:#570033;--ln2:#fca6cb;--ln3:#e992b8;--edge:#ffddea;--sh:rgb(0 0 0 / .55);--ring:#18181b}}
    :root.dark .ic-chat-bubble,:root[data-theme=dark] .ic-chat-bubble{--g3a:#f27fb3;--g3b:#cf6094;--g2a:#ffbfd9;--g2b:#fc83ba;--g1a:#f253a4;--g1b:#c01d79;--ln1:#570033;--ln2:#fca6cb;--ln3:#e992b8;--edge:#ffddea;--sh:rgb(0 0 0 / .55);--ring:#18181b}
    .ic-chat-bubble .g1a{stop-color:var(--g1a)}.ic-chat-bubble .g1b{stop-color:var(--g1b)}
    .ic-chat-bubble .g2a{stop-color:var(--g2a)}.ic-chat-bubble .g2b{stop-color:var(--g2b)}
    .ic-chat-bubble .g3a{stop-color:var(--g3a)}.ic-chat-bubble .g3b{stop-color:var(--g3b)}
    .ic-chat-bubble .l1{stroke:var(--ln1)}.ic-chat-bubble .l2{stroke:var(--ln2)}.ic-chat-bubble .l3{stroke:var(--ln3)}
    .ic-chat-bubble .rim{stroke:var(--edge)}.ic-chat-bubble .bd{stroke:var(--ring)}
    .ic-chat-bubble .sh{flood-color:var(--sh)}
    .ic-chat-bubble .hl{fill:#fff;fill-opacity:.42}
    .ic-chat-bubble [data-part=badge]{transform-box:fill-box;transform-origin:center;transform:scale(0)}
    .ic-chat-bubble[data-state=on] [data-part=badge]{transform:scale(1)}
  </style>
  <defs><linearGradient id="ic-chat-bubble-sm-g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="g1a"/><stop offset="1" class="g1b"/></linearGradient><linearGradient id="ic-chat-bubble-sm-g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="g2a"/><stop offset="1" class="g2b"/></linearGradient><linearGradient id="ic-chat-bubble-sm-g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="g3a"/><stop offset="1" class="g3b"/></linearGradient><filter id="ic-chat-bubble-sm-sh" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="1.1"/><feOffset dy="1.3" result="o"/><feFlood class="sh"/><feComposite in2="o" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <g filter="url(#ic-chat-bubble-sm-sh)">
